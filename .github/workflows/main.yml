name: CI Build

# Triggers on push and branches on the master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  all:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type : [ Debug, Release ]
        shared_type : [ OFF, ON ]
        profiling : [ OFF, ON ]
        device: [ cpu, gpu_nvidia, gpu_amd ]
        exclude:
          - build_type: Debug
            profiling: OFF
          - build_type: Release
            shared_type: OFF
    name: "${{matrix.build_type}} Shared=${{matrix.shared_type}} Profile=${{matrix.profiling}} ${{matrix.device}}"
    runs-on: [ "${{matrix.device}}", self-hosted ]
    env:
      BUILD_TYPE:  ${{matrix.build_type}}
      SHARED_TYPE: ${{matrix.shared_type}}
      PROFILING:   ${{matrix.profiling}}
      DEVICE: ${{matrix.device}}
      BUILD_DIRECTORY: build
      INSTALL_DIRECTORY: install
    steps:
    - uses: actions/checkout@v4

    - name: Setup Build Environment ${{ runner.os }}
      run: .github/CI/setup.sh

    - name: Configure CMake
      run: .github/CI/configure.sh

    - name: Build
      run: .github/CI/build.sh

    - name: Install
      run: .github/CI/install.sh

    - name: Test
      run: .github/CI/test.sh

    - name: Save Artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: CMake-error-log
        path: CMakeFiles/CMakeError.log

  # Compile all the profiling substrates (binary, OTF2, NVTX, Score-P), the
  # jobs above only build the binary format.
  profiling_substrates:
    timeout-minutes: 45
    name: "Debug Shared=ON Profile=all-substrates cpu (build only)"
    runs-on: [ "cpu", self-hosted ]
    env:
      BUILD_TYPE:  Debug
      SHARED_TYPE: ON
      PROFILING:   ON
      DEVICE: cpu
      SETUP: ${{github.workspace}}/.github/CI/env_setup.sh
      DEPS: ~/.cache/parsec-profiling-deps
    steps:
    - uses: actions/checkout@v4

    - name: Cache profiling dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/parsec-profiling-deps
        key: profiling-deps-${{ runner.os }}-${{ hashFiles('.github/CI/profiling_deps.sh') }}

    - name: Fetch profiling dependencies
      run: |
            source $SETUP
            $GITHUB_WORKSPACE/.github/CI/profiling_deps.sh $(eval echo $DEPS)
            cmake -E make_directory build

    - name: Configure CMake
      working-directory: build
      run: |
           source $SETUP
           DEPS=$(eval echo $DEPS)
           cmake $GITHUB_WORKSPACE $BUILD_CONFIG \
                 -DPARSEC_PROF_TRACE_SYSTEM=OTF2 -DOTF2_DIR=$DEPS/otf2 \
                 -DPARSEC_PROF_TRACE_NVTX=ON -DPARSEC_NVTX_ROOT=$DEPS/nvtx/c \
                 -DPARSEC_PROF_TRACE_SCOREP=ON -DPARSEC_SCOREP_ROOT=$DEPS/scorep

    - name: Build
      working-directory: build
      run: |
           source $SETUP
           cmake --build .
